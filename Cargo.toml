[workspace]
resolver = "2"
members = [
    "crates/hoardini-core",
    "crates/hoardini-cli",
    "crates/hoardini-host",
    "crates/hoardini-app",
]

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hoardini-core = { path = "crates/hoardini-core" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "sync", "io-util", "net", "signal"] }
tokio-util = "0.7"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
