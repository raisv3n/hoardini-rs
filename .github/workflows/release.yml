# Push a tag like v0.5.5 to build, test and publish a GitHub Release with the Windows zip.
# (Run it by hand from the Actions tab to get the zip as a build artifact without releasing.)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ffmpeg lets the conversion tests run instead of being skipped.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: hoardini-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
